  <script>
    /* 主题防闪烁：在样式应用前恢复用户选择 */
    (function () {
      try {
        var t = null;
        var raw = localStorage.getItem('std-term:theme');
        if (raw != null) t = JSON.parse(raw);
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
